openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Private agent connections. All operations except health require a verified Clerk session cookie; saved agents and criteria are scoped to the authenticated owner.
security:
  - clerkSession: []
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /setup:
    get:
      operationId: getSetup
      responses:
        "200":
          description: Setup readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Setup" }
  /connections/discover:
    post:
      operationId: discoverAgents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialInput" }
      responses:
        "200":
          description: Available ElevenLabs agents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RemoteAgent" }
  /connections/preview:
    post:
      operationId: previewAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentSelection" }
      responses:
        "200":
          description: Imported criteria preview, does not save credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentPreview" }
  /agents:
    get:
      operationId: listAgents
      responses:
        "200":
          description: Connected agents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Agent" }
    post:
      operationId: connectAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectionInput" }
      responses:
        "201":
          description: Agent saved with encrypted credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
  /agents/{id}:
    get:
      operationId: getAgent
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Connected agent and imported criteria
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
  /agents/{id}/monitoring:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateMonitoring
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitoringInput" }
      responses:
        "200":
          description: Saved polling configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitoring" }
  /agents/{id}/poll:
    post:
      operationId: pollAgent
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Poll result or current state when not yet due. Errors are recorded in lastError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitoring" }
  /agents/{id}/calls:
    get:
      operationId: listCalls
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: result, schema: { type: string, enum: [all, passed, failed, unknown] } }
        - { in: query, name: source, schema: { type: string, enum: [all, production, test, unknown] } }
        - { in: query, name: category, schema: { type: string, maxLength: 1000, default: all }, description: "all, unknown, passed, other-failure, or criterion:<provider criterion ID>. Categories use recorded failures, not inferred diagnoses." }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200":
          description: Owner-scoped stored calls, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallPage" }
  /agents/{id}/calls/{callId}:
    get:
      operationId: getCall
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: callId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Private transcript and provider evaluations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallDetail" }
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk-managed same-origin session cookie. Never collect or attach session tokens manually in browser code.
  schemas:
    MonitoringInput:
      type: object
      required: [enabled, pollMinutes]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        pollMinutes: { type: integer, minimum: 1, maximum: 1440 }
    Monitoring:
      type: object
      required: [enabled, pollMinutes, lastAttemptAt, lastSuccessAt, nextPollAt, lastError]
      properties:
        enabled: { type: boolean }
        pollMinutes: { type: integer }
        lastAttemptAt: { type: ["string", "null"] }
        lastSuccessAt: { type: ["string", "null"] }
        nextPollAt: { type: ["string", "null"] }
        lastError: { type: ["string", "null"] }
    CallSummary:
      type: object
      required: [id, conversationId, startedAt, durationSecs, status, result, source, versionId, summary, evaluationCount, failureReasons, criteriaCount, failedCriteriaCount, passedCriteriaCount, unknownCriteriaCount]
      properties:
        id: { type: string }
        conversationId: { type: string }
        startedAt: { type: string }
        durationSecs: { type: integer }
        status: { type: string }
        result: { type: string, enum: [passed, failed, unknown] }
        source: { type: string, enum: [production, test, unknown] }
        versionId: { type: ["string", "null"] }
        summary: { type: ["string", "null"] }
        evaluationCount: { type: integer }
        failureReasons: { type: array, items: { $ref: "#/components/schemas/CallEvaluation" } }
        criteriaCount: { type: integer, description: Distinct configured or reported criteria; missing results remain unknown }
        failedCriteriaCount: { type: integer }
        passedCriteriaCount: { type: integer }
        unknownCriteriaCount: { type: integer }
    TranscriptTurn:
      type: object
      required: [role, text, timeInCallSecs]
      properties:
        role: { type: string }
        text: { type: ["string", "null"] }
        timeInCallSecs: { type: integer }
    CallEvaluation:
      type: object
      required: [criterionId, name, result, rationale, score, maxScore]
      properties:
        criterionId: { type: string }
        name: { type: string }
        result: { type: string, enum: [success, failure, unknown] }
        rationale: { type: string }
        score: { type: ["integer", "null"] }
        maxScore: { type: ["integer", "null"] }
    CallDetail:
      allOf:
        - $ref: "#/components/schemas/CallSummary"
        - type: object
          required: [transcript, evaluations, environment]
          properties:
            transcript: { type: array, items: { $ref: "#/components/schemas/TranscriptTurn" } }
            evaluations: { type: array, items: { $ref: "#/components/schemas/CallEvaluation" } }
            environment: { type: ["string", "null"] }
    CallPage:
      type: object
      required: [items, total, offset, limit, monitoring, categories]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CallSummary" } }
        total: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
        monitoring: { $ref: "#/components/schemas/Monitoring" }
        categories:
          type: array
          description: Counts across all saved calls matching source, independent of pagination and result/category filters. Calls may fail more than one criterion.
          items: { $ref: "#/components/schemas/CallCategory" }
    CallCategory:
      type: object
      required: [id, name, count]
      properties:
        id: { type: string }
        name: { type: string }
        count: { type: integer }
    Setup:
      type: object
      required: [databaseReady, encryptionReady, message]
      properties:
        databaseReady: { type: boolean }
        encryptionReady: { type: boolean }
        message: { type: string }
    CredentialInput:
      type: object
      required: [apiKey]
      properties:
        apiKey: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
    AgentSelection:
      type: object
      required: [apiKey, remoteId]
      properties:
        apiKey: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
        remoteId: { type: string, minLength: 1, maxLength: 200 }
    ConnectionInput:
      type: object
      required: [apiKey, remoteId, userCriteria]
      properties:
        apiKey: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
        remoteId: { type: string, minLength: 1, maxLength: 200 }
        userCriteria:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 4000 }
    RemoteAgent:
      type: object
      required: [remoteId, name, tags]
      properties:
        remoteId: { type: string }
        name: { type: string }
        tags: { type: array, items: { type: string } }
    Criterion:
      type: object
      required: [id, name, text, source, passed, failed, unknown]
      properties:
        id: { type: string }
        name: { type: string }
        text: { type: string }
        source: { type: string, enum: [imported, user, loop] }
        passed: { type: integer }
        failed: { type: integer }
        unknown: { type: integer }
    AgentPreview:
      type: object
      required: [remoteId, name, criteria, warning]
      properties:
        remoteId: { type: string }
        name: { type: string }
        criteria: { type: array, items: { $ref: "#/components/schemas/Criterion" } }
        warning: { type: ["string", "null"] }
    Agent:
      type: object
      required: [id, remoteId, name, platform, createdAt, criteriaCount, failedCriteriaCount, passRate, openFailures, status, keyMasked]
      properties:
        id: { type: string }
        remoteId: { type: string }
        name: { type: string }
        platform: { type: string }
        createdAt: { type: string }
        criteriaCount: { type: integer }
        failedCriteriaCount: { type: ["integer", "null"], description: Distinct criteria with recorded failures on completed production calls; null without measured criterion results }
        passRate: { type: ["number", "null"] }
        openFailures: { type: ["integer", "null"] }
        status: { type: string }
        keyMasked: { type: string }
    AgentDetail:
      allOf:
        - $ref: "#/components/schemas/Agent"
        - type: object
          required: [criteria, warning, monitoring]
          properties:
            criteria: { type: array, items: { $ref: "#/components/schemas/Criterion" } }
            warning: { type: ["string", "null"] }
            monitoring: { $ref: "#/components/schemas/Monitoring" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

