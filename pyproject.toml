[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Manasi Gupta", email = "41942271-guptamanasi888@users.noreply.replit.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "elevenlabs>=2.79.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pyjwt[crypto]>=2.12.0",
    "pytest>=9.2.0",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
repl-nix-workspace = "repl_nix_workspace:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
