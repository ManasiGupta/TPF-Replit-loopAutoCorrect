kind = "web"
previewPath = "/"
title = "Loop"
description = "A single-user workspace for connecting ElevenLabs voice agents and improving their reliability from production failures. Phase 1 connects agents securely and imports evaluation criteria."
version = "1.0.0"
id = "artifacts/loop"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20741

[services.development]
run = "pnpm --filter @workspace/loop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/loop", "run", "build" ]
serve = "static"
publicDir = "artifacts/loop/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20741"
BASE_PATH = "/"
